<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘은 지우의 생일이래요</title>
<!-- 카톡·인스타 링크 미리보기. 세로로 긴 표지를 그대로 주면 얼굴이 잘려서
     1200x630 으로 따로 구성한 og.png 를 쓴다. 절대 주소여야 읽힌다. -->
<meta property="og:type" content="website">
<meta property="og:title" content="오늘은 지우의 생일이래요">
<meta property="og:description" content="짱구가 지우한테 전하는 생일 축하">
<meta property="og:image" content="https://tjdwns95135.github.io/jiwoo-birthday/a/og-v2.png?b=08282334">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
/* ── 팔레트: 짱구 오프닝 화면에서 뽑은 색 ── */
:root{
  --sky:#4FA8E0; --sky-hi:#7FC8F0; --sky-lo:#2E86C8;
  --cloud:#EFF6FF;
  --red:#E23B2E; --yellow:#F9DC4A; --cream:#FFF7DE;
  --intro-bg:#F6EEAA;
  --pink:#FF6FA5;
  --ink:#241C14; --grass:#5FBF3F;
  --title:'Jua',sans-serif;
  --body:'Jua',sans-serif;
  --hand:'Gaegu',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#141414}
body{
  font-family:var(--body); color:var(--ink);
  /* 세로는 위쪽 기준. 가운데로 두면 폰 주소창이 사라져 화면이 커질 때
     남는 높이의 절반만큼 전체가 아래로 밀려서 버튼이 화면 밖으로 나간다. */
  display:grid; align-items:start; justify-items:center;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

/* ── 무대: 세로 화면 기준. PC에선 가운데 정렬 ── */
#stage{
  position:relative; overflow:hidden;
  width:min(100vw,460px);
  /* 주어진 높이를 그대로 쓴다. 9:16으로 자르면 길쭉한 폰에서 위아래가 남고
     아티팩트 iframe 안에서는 더 어긋난다. */
  height:100dvh;
  /* 글자·이미지 크기를 창이 아니라 이 스테이지 너비에 맞추기 위한 선언 */
  container-type:inline-size;
  background:linear-gradient(180deg,var(--sky-hi) 0%,var(--sky) 55%,#96DAF7 100%);
  box-shadow:0 0 70px rgba(0,0,0,.55);
}
#stage.shake{animation:shake .34s ease}
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-8px,6px)}
  45%{transform:translate(7px,-5px)}
  70%{transform:translate(-5px,-3px)}
}

/* ── 흘러가는 구름 ── */
.clouds{position:absolute;inset:0;overflow:hidden;pointer-events:none}
/* drop-shadow 필터는 매 프레임 다시 계산돼서 구름이 끊긴다.
   같은 느낌은 아래쪽에 반투명 테두리 한 겹으로 낸다(그리기 비용 없음).
   will-change 로 별도 레이어에 올려 다른 요소 repaint 와 분리한다. */
.cloud{position:absolute;left:100%;background:var(--cloud);border-radius:50%;
  box-shadow:0 7px 0 rgba(150,195,235,.45);
  will-change:transform;transform:translateZ(0)}
.cloud::before,.cloud::after{content:'';position:absolute;background:var(--cloud);border-radius:50%}
.cloud::before{width:64%;height:112%;left:-22%;top:4%}
.cloud::after{width:52%;height:96%;right:-16%;top:14%}
/* 오른쪽 화면 밖에서 시작해 왼쪽 화면 밖까지 건너간다.
   이동 거리는 JS 가 픽셀로 계산해 --travel 로 넘긴다.
   여기서 cqw 같은 상대 단위를 쓰면 브라우저가 매 프레임 컨테이너 크기를
   다시 재느라 움직임이 끊긴다. */
@keyframes drift{
  from{transform:translateX(0)}
  to{transform:translateX(var(--travel))}
}

/* ── 잔디 언덕 (하단 고정) ── */
.hill{position:absolute;left:-10%;width:120%;height:34%;bottom:-14%;
  background:var(--grass);border-radius:50% 50% 0 0;pointer-events:none}
.hill.back{bottom:-8%;height:28%;background:#4EA832;opacity:.85}

/* ── 장면 ── */
.scene{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:22px;
  opacity:0;visibility:hidden;
  transition:opacity .4s ease,visibility .4s;
}
.scene.on{opacity:1;visibility:visible}

/* ── 만화 컷 프레임 ──
   원본이 640x480이라 전체화면으로 늘리면 2.5배 확대돼 뭉갠다.
   가로폭에 맞춘 4:3 밴드면 확대율 1.2배 이하라 선명하게 유지된다. */
.panel{
  position:relative;
  width:100%;aspect-ratio:4/3;flex:none;
  border:5px solid var(--ink);border-radius:16px;overflow:hidden;
  /* 영상이 아직 안 왔을 때 보이는 색. 검정이면 구멍처럼 보인다. */
  background:var(--sky-hi);
  box-shadow:0 10px 0 rgba(0,0,0,.24);
}
/* 클립 두 개를 겹쳐 두고 표시만 바꾸므로 절대 위치로 포갠다. */
.panel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 크림색 안쪽 테두리를 inset box-shadow 로 주면 영상이 로드되는 순간
   그 위를 덮어버려 테두리가 벗겨졌다 씌워졌다 한다. 영상 위에 얹는다. */
.panel::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 4px var(--cream);
  border-radius:11px;
}

/* ── 오프닝 타이틀 장면 ──
   사용자가 준 인트로 영상(1920x1080)이 배경. 가운데가 비어 있어 타이틀 자리가 된다.
   세로 화면이라 cover로 좌우가 잘리지만 장난감은 사방에 있어 분위기는 남는다.
   영상 밖 여백은 인트로 배경색과 같게 칠해 경계가 안 보이게 한다. */
#s-title{background:var(--intro-bg);padding:20px}
#v-intro{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:0;pointer-events:none;
}
#s-title > :not(#v-intro){position:relative;z-index:1}

/* ── 짱구 로고풍 타이틀 ──
   크림색 배경 위라 핑크 채움 + 두툼한 검정 외곽선 + 크림 그림자로 3층을 만든다. */
.bigtitle{
  font-family:var(--title);
  font-size:clamp(40px,13cqw,66px);
  line-height:1.1;text-align:center;letter-spacing:-.01em;
  color:var(--pink);
  -webkit-text-stroke:10px var(--ink);
  paint-order:stroke fill;
  text-shadow:0 8px 0 var(--cream),0 12px 0 rgba(0,0,0,.35);
  transform:scale(2.3) rotate(-9deg);opacity:0;
  /* 3.4배에서 1배로 줄어드는 동안, 10px 외곽선과 그림자 두 겹을 매 프레임
     거대한 크기로 다시 그리느라 메인 스레드가 250ms 넘게 멈춘다.
     한 번만 그려 두고 그 결과를 확대·축소하도록 별도 레이어로 올린다. */
  will-change:transform,opacity;
}
.bigtitle.on{animation:slam .75s cubic-bezier(.2,1.5,.35,1) forwards}
@keyframes slam{
  0%{transform:scale(2.3) rotate(-9deg);opacity:0}
  50%{opacity:1}
  68%{transform:scale(.9) rotate(2.5deg);opacity:1}
  84%{transform:scale(1.07) rotate(-1.5deg)}
  100%{transform:scale(1) rotate(0deg);opacity:1}   /* 끝에는 반듯하게 선다 */
}

/* ── 부제 / 자막 ── */
.sub{
  font-size:clamp(15px,4.6cqw,21px);color:#fff;letter-spacing:.01em;
  text-shadow:0 3px 0 var(--sky-lo),0 0 12px rgba(0,0,0,.22);
  opacity:0;transform:translateY(10px);
  transition:opacity .45s ease,transform .45s ease;
}
.sub.on{opacity:1;transform:translateY(0)}
/* 크림색 인트로 배경 위에서는 흰 글씨가 안 보이므로 어둡게 뒤집는다. */
.sub.dark{color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.85)}

.caption{
  font-size:clamp(17px,5cqw,23px);text-align:center;line-height:1.5;
  color:#fff;padding:12px 20px;border-radius:999px;
  background:rgba(36,28,20,.84);box-shadow:0 4px 0 rgba(0,0,0,.26);
  opacity:0;transform:translateY(14px) scale(.96);
  transition:opacity .35s ease,transform .35s cubic-bezier(.2,1.4,.4,1);
  max-width:100%;
}
.caption.on{opacity:1;transform:translateY(0) scale(1)}

/* ── 캐릭터 소개 컷 ── */
#s-cast{justify-content:center;gap:10px}
/* 소개 컷은 PNG일 수도 MP4일 수도 있다. 둘이 같은 자리·같은 크기를 쓰도록
   인라인 스타일을 복사하지 말고 이 클래스 하나를 공유한다. */
/* 소개 컷·이름·자막이 하나씩 나타나면 세로 가운데 정렬이 매번 다시 잡혀
   화면 전체가 아래에서 위로 밀린다. 자리를 미리 고정해 둔다. */
.cast-slot{
  position:relative;flex:none;
  width:min(72cqw,320px);height:min(72cqw,320px);
}
.cap-slot{
  width:100%;min-height:58px;flex:none;
  display:grid;place-items:center;
}
.cast-media{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain;border-radius:14px;
  /* drop-shadow 는 프레임이 바뀔 때마다 다시 계산된다. 움직이는 APNG 에 걸면
     매 프레임 그림자를 새로 그리느라 메인 스레드가 막히고 배경 구름이 끊긴다. */
  opacity:0;transform:scale(.6) rotate(-8deg);
}
.cast-media.on{animation:castIn .5s cubic-bezier(.2,1.6,.4,1) forwards;
  will-change:transform,opacity}
/* PNG 소개컷은 배경이 투명해 캐릭터만 뜨지만, 영상 컷은 원본 배경이 남는다.
   테두리를 둘러 "액자에 넣은 사진"으로 보이게 해야 나란히 놔도 안 어색하다. */
/* video 는 대체 요소라 ::after 를 못 붙이고, inset box-shadow 는 영상에 덮인다.
   안쪽 크림 테두리는 border, 바깥 검정은 outline 으로 준다. 둘 다 안 덮인다. */
video.cast-media{
  border:4px solid var(--cream);
  outline:4px solid var(--ink);
  background:var(--sky-hi);
  box-shadow:0 8px 0 rgba(0,0,0,.22);
}
@keyframes castIn{to{opacity:1;transform:scale(1) rotate(0)}}
#cast-name{
  min-height:1.15em;                 /* 이름이 비어 있어도 자리를 지킨다 */
  font-family:var(--title);font-size:clamp(28px,8.5cqw,40px);
  color:var(--cream);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;
  text-shadow:0 6px 0 var(--red);
  opacity:0;transform:translateY(16px);
  transition:opacity .35s ease,transform .35s cubic-bezier(.2,1.5,.4,1);
}
#cast-name.on{opacity:1;transform:translateY(0)}

/* ── 엉덩이 전환: 화면을 꽉 채워 다음 장면을 덮는다 ── */
#s-wipe{padding:0;background:var(--sky-hi)}
#s-wipe video{width:100%;height:100%;object-fit:cover}

/* ── 피날레 ── */
/* 아래 끝에 붙이면 카톡·인스타 인앱 브라우저의 하단 툴바에 가려진다.
   그 툴바 높이는 innerHeight 에 안 잡혀서 계산으로는 피할 수 없다.
   가운데로 모으면 아래가 100px 쯤 잘려도 버튼이 살아 있는다. */
#s-party{justify-content:center;gap:16px}
/* 같은 이유로 그림자 필터를 뺐다. 숨어 있을 때도 APNG 는 계속 디코딩되므로
   피날레에 들어갈 때 JS 가 표시한다. */
#dancer{width:min(60cqw,260px);height:auto;display:none}
#dancer.show{display:block}
#confetti{position:absolute;inset:0;pointer-events:none}

/* ── 편지 + 사진 (옆으로 넘기는 두 장) ── */
#s-final{justify-content:center;gap:14px}
/* scroll-snap 으로 넘긴다. 직접 드래그를 구현하는 것보다 폰에서 훨씬 자연스럽다. */
/* 두 장의 높이를 여기서 한 번에 정한다. 카드마다 따로 두면 넘길 때 상자 크기가
   바뀌어 화면이 출렁인다. */
/* 다시 보기 버튼이 흐름에서 빠져 오른쪽 아래로 갔으므로 카드가 더 커질 수 있다 */
.pager{
  width:100%;height:80%;flex:none;
  display:flex;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.pager::-webkit-scrollbar{display:none}
.page{
  flex:0 0 100%;height:100%;
  scroll-snap-align:center;
  display:flex;
}
.letter,.card2{width:100%;height:100%}
/* 넘길 게 더 있다는 표시 */
.pager-hint{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.35);
}
.pager-hint .dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,.45);
  transition:background .25s,transform .25s;
}
.pager-hint .dot.on{background:#fff;transform:scale(1.25)}
.pager-hint .swipe{
  margin-left:4px;opacity:.9;
  animation:nudge 1.8s ease-in-out infinite;
}
.pager-hint.seen .swipe{display:none}

/* 다시 보기 ──
   글에 이어 붙이면 카드가 길어질수록 아래로 밀려 카톡 인앱 브라우저의
   하단 툴바에 가린다. 흐름에서 빼서 오른쪽 아래에 아이콘만 남긴다.
   툴바 높이는 innerHeight 에 안 잡히므로 그만큼 띄워 둔다. */
#replay{
  position:absolute;right:16px;bottom:78px;z-index:30;
  width:52px;height:52px;padding:0;
  border-radius:50%;
  font-size:24px;line-height:1;
  display:grid;place-items:center;
  box-shadow:0 5px 0 var(--ink);
  animation:none;                  /* 구석에서는 커졌다 작아질 필요가 없다 */
}
#replay:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
@keyframes nudge{0%,100%{transform:translateX(0)}55%{transform:translateX(5px)}}

/* 2장: 곡선 글씨 + 사진 */
.card2{
  background:var(--cream);
  border:4px solid var(--ink);border-radius:20px;
  /* 아래를 넉넉히 둬서 사진 밑으로 크림색 테두리가 보이게 한다 */
  padding:8px 14px 20px;
  box-shadow:0 12px 0 rgba(0,0,0,.24);
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.arc{width:100%;height:auto;overflow:visible;flex:none}
.arc-t{
  font-family:var(--title);font-size:31px;
  fill:var(--pink);
  stroke:var(--ink);stroke-width:7;stroke-linejoin:round;
  paint-order:stroke fill;      /* 외곽선을 글자 아래로 깔아야 획이 안 먹힌다 */
}
/* 남는 높이를 사진이 채운다. 고정 비율로 두면 카드 아래에 빈 칸이 생기거나
   반대로 테두리를 밀어내 버린다. */
.photo{
  flex:1 1 auto;min-height:0;
  width:100%;object-fit:cover;
  border:4px solid var(--ink);border-radius:14px;
  background:var(--sky-hi);
}
.letter{
  width:100%;background:var(--cream);
  border:4px solid var(--ink);border-radius:20px;
  padding:26px 22px 26px;
  box-shadow:0 12px 0 rgba(0,0,0,.24);
  transform:scale(.85);opacity:0;
  overflow-y:auto;
  /* 사진 장과 높이가 같으므로 내용은 가운데로 모은다 */
  display:flex;flex-direction:column;justify-content:center;
}
.letter.on{animation:pop .6s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{to{transform:scale(1);opacity:1}}
.letter h2{
  font-family:var(--title);font-size:clamp(27px,8.4cqw,37px);
  color:var(--yellow);text-align:center;margin-bottom:16px;line-height:1.2;
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;
  text-shadow:0 5px 0 var(--red);
}
.letter p{
  font-family:var(--hand);font-weight:700;
  font-size:clamp(19px,5.4cqw,24px);line-height:1.8;white-space:pre-line;
}
.letter .from{
  text-align:right;margin-top:18px;
  font-family:var(--hand);font-weight:700;
  font-size:clamp(18px,5cqw,22px);color:#8a6438;
}

/* ── 버튼 ── */
.btn{
  font-family:var(--title);font-size:clamp(19px,5.6cqw,25px);
  color:var(--cream);background:var(--red);
  border:4px solid var(--ink);border-radius:999px;
  padding:14px 34px;cursor:pointer;
  box-shadow:0 7px 0 var(--ink);
  transition:transform .1s,box-shadow .1s;
  will-change:transform;      /* 크기 애니메이션을 별도 레이어에서 처리 */
  /* 위아래로 튕기면 "흔들리다 멈췄다" 처럼 보인다. 키프레임 두 개짜리
     ease-in-out 은 양 끝에서 감속하며 멎기 때문이다.
     자리를 옮기지 않고 크기만 아주 조금 변하게 해서 눈에만 띄게 한다. */
  animation:pulse 2.4s ease-in-out infinite;
}
.btn:active{transform:scale(.96) translateY(5px);box-shadow:0 1px 0 var(--ink);animation:none}
@keyframes pulse{
  0%,100%{transform:scale(1)}
  45%{transform:scale(1.045)}
  70%{transform:scale(1.01)}
}

/* ── 시작 화면 ── */
#gate{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;

<script>
/* ══════════════════════════════════════════════════════════
   ▼▼▼ 여기만 고치면 됩니다 ▼▼▼
   ══════════════════════════════════════════════════════════ */

const LETTER = {
  title: "지우야\n생일축하해",
  body:
`이건 짱구 좋아하는 지우를 위한
자그마한 선물(?)이야

매일 나랑 놀아줘서 고마워

항상 행복만 하자

생일축하해`,
  from: "— 성준이가"
};

/* 목소리 설정.
   실제 성우 목소리는 쓰지 않는다. 브라우저 한국어 음성의 음높이를 크게 올리고
   속도를 살짝 붙여 "만화 속 능글맞은 꼬마" 톤을 만든다.
   a/<id>.mp3 를 넣어두면 TTS 대신 그 파일을 먼저 재생한다. */
const VOICE = {
  on:   true,   // 목소리 전체 on/off
  /* 파일이 없을 때 브라우저 음성으로 때우면, 앞뒤 짱구 목소리와 톤이 확 달라
     그 줄만 다른 사람이 말하는 것처럼 들린다. 차라리 무음으로 둔다. */
  tts:  false,
  lang: 'ko-KR',
  pitch: 1.85,  // 기본 음높이 (0~2). 높을수록 어리게
  rate:  1.06   // 기본 속도
};

/* 캐릭터 소개 컷. 짱구 말투로 한 줄씩.
   v: 녹음 파일 이름(a/v01.mp3?b=08282334), p/r: 그 줄만 음높이·속도 조정 */
const CAST = [
  { el:'#c-shin',    name:'짱구',       line:'안녕하세요~ 저는 짱구예요',        v:'v01', p:1.9 },
  { el:'#v-shiro',   name:'흰둥이',     line:'얘는 우리 흰둥이고요',             v:'v02' },
  { el:'#c-friends', name:'떡잎방범대', line:'다들 오늘 무슨 날인지 안대요',      v:'v03' },
  { el:'#c-mask',    name:'액션가면',   line:'중요한 날이라 이렇게 갈아입었어요', v:'v04', p:1.5, r:0.98 }
];

const RUN_CAPS = [
  { t:'그래서 지금 열심히 달려가는 중이에요', v:'v05', r:1.14 },
  { t:'흰둥이도 같이 뛰어요',                 v:'v06', r:1.14 },
  /* vid 를 주면 그 자막 동안만 다른 클립을 보여준다 (미리 DOM에 있는 것) */
  { t:'오늘 떡잎마을에 큰일이 났거든요',       v:'v07', r:1.1, vid:'#v-news' }
];

/* 눈썹 씰룩 — 쑥쓰러움 직전에 한 번 치고 들어간다.
   v11은 편지 음성을 뺀 자리라, v01~v10 번호는 그대로 유지된다. */
const FLIRT_LINE = { t:'저기 예쁜 누나!', v:'v11', p:1.95, r:1.05 };

const SHY_CAPS = [
  { t:'사실.. 할 말이 있는데요..!', v:'v08', p:1.6, r:0.9 },
  { t:'부끄러워서 못 하겠어요',     v:'v09', p:1.55, r:0.88 }
];

/* 오프닝 타이틀이 쿵 하고 나타나는 순간에 같이 나가는 대사 */
const TITLE_LINE = { t:'오늘은 지우의 생일이래요', v:'v00' };

/* 피날레 대사 */
const PARTY_LINE = { t:'준비됐어? 눌러봐!', v:'v10', p:1.95, r:1.1 };

/* 배경음악 음량은 파일 자체를 -16dB 로 인코딩해 맞춰 놓았다.
   (iOS 가 audio.volume 을 무시해서 코드로는 못 줄인다)
   여기 값은 데스크톱 페이드인의 목표치일 뿐 1 로 둔다. */
const BGM_VOLUME = 1;

/* ══════════════════════════════════════════════════════════
   ▲▲▲ 여기까지 ▲▲▲
   ══════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const stage = $('#stage');

/* ── 미리 받아두기 ──
   폰 브라우저는 <video preload="auto"> 를 데이터 절약 때문에 대체로 무시한다.
   그래서 장면이 바뀌는 순간에야 받기 시작해 검은 화면이 잠깐 뜬다.
   표지를 보고 있는 동안(사용자가 버튼 누르기 전) 전부 캐시에 채워둔다. */
(function prefetch(){
  const list = [
    'a/intro.mp4?b=08282334',
    'a/shin-run.mp4?b=08282334',
    'a/shin-news.mp4?b=08282334',
    'a/shin-butt.mp4?b=08282334',
    'a/shin-eyebrow.mp4?b=08282334',
    'a/shin-shy.mp4?b=08282334',
    'a/shiro.mp4?b=08282334',
    'a/intro.mp3?b=08282334',
    /* 소개 컷 APNG. 떡잎방범대가 956KB 로 제일 크다. */
    'a/shin-front-alpha.png?b=08282334',
    'a/friends-alpha.png?b=08282334',
    'a/mask-alpha.png?b=08282334',
    'a/shin-dance-alpha.png?b=08282334',
    'a/photo-e73799067b891d63.jpg?b=08282334'
  ];
  for(let i = 0; i <= 11; i++){   /* v00 = 오프닝 타이틀 대사 */
    list.push('a/v' + String(i).padStart(2,'0') + '.mp3?b=08282334');
  }
  for(const u of list){
    fetch(u).then(r => r.blob()).catch(()=>{});
  }
})();
const scenes = {
  title:$('#s-title'), cast:$('#s-cast'), run:$('#s-run'),
  wipe:$('#s-wipe'), flirt:$('#s-flirt'), shy:$('#s-shy'),
  party:$('#s-party'), final:$('#s-final')
};

/* 편지 채우기 */
$('#final-h').innerHTML   = LETTER.title.replace(/\n/g,'<br>');
$('#final-body').textContent = LETTER.body;
$('#final-from').textContent = LETTER.from;

/* ── 구름 ── */
(function(){
  const wrap = $('#clouds');
  const stageW = stage.getBoundingClientRect().width || 430;
  for(let i=0;i<5;i++){                       /* 5개면 충분하다. 많을수록 합성 비용만 는다 */
    const c = document.createElement('div');
    c.className = 'cloud';
    const w = 70 + Math.random()*95;
    /* 오른쪽 화면 밖(left:100%)에서 시작해 자기 너비까지 완전히 빠져나간다 */
    const travel = -(stageW + w + 20);
    const dur = 26 + Math.random() * 26;
    c.style.cssText =
      `width:${w}px;height:${w*0.42}px;top:${3+Math.random()*55}%;` +
      `--travel:${travel}px;` +
      `opacity:${(0.55+Math.random()*0.4).toFixed(2)};` +
      /* 시작 지연을 주기 전체에 흩어야 한쪽에 몰리지 않는다 */
      `animation:drift ${dur}s linear ${-Math.random()*dur}s infinite`;
    wrap.appendChild(c);
  }
})();

/* ── 유틸 ── */
let current = null;
/* 다시 보기를 누르면 이전 재생을 끊어야 한다. 예전에는 aborted 플래그를 썼는데,
   run() 이 시작하면서 그 플래그를 다시 false 로 만들어 버려 멈췄어야 할 루프가
   되살아났다(= 소리가 겹쳤다). 재생마다 번호를 매기고, 번호가 바뀌면 옛 루프는
   스스로 빠져나가게 한다. */
let runId = 0;
const stale = id => id !== runId;

function show(name){
  if(current) scenes[current].classList.remove('on');
  scenes[name].classList.add('on');
  current = name;
}
/* 중간에 건너뛰면 남은 대기를 즉시 깨고 나온다. */
/* ── 높이 맞추기 ──
   카톡·인스타 같은 인앱 브라우저는 자기 상단/하단 바를 빼지 않아서
   100dvh 가 실제 보이는 높이보다 크게 나온다. 그러면 아래가 잘린다.
   visualViewport(있으면) 또는 innerHeight 로 실제 높이를 재서 직접 넣는다. */
let fittedH = 0, fitTimer = null;
function fitStage(force){
  const h = window.innerHeight;
  if(!h) return;
  /* 폰은 스크롤할 때 주소창이 들락거리며 높이가 몇십 px씩 계속 바뀐다.
     그때마다 다시 맞추면 화면 전체가 위아래로 덜컹거린다.
     회전처럼 확실히 달라졌을 때만(80px 초과) 다시 잡는다. */
  if(!force && fittedH && Math.abs(h - fittedH) < 80) return;
  fittedH = h;
  stage.style.height = h + 'px';
  try{ sizeCanvas(); }catch(e){}
}
addEventListener('resize', ()=>{
  clearTimeout(fitTimer);
  fitTimer = setTimeout(()=>fitStage(false), 200);
});
addEventListener('orientationchange', ()=> setTimeout(()=>fitStage(true), 300));

const sleepers = new Set();
function wait(ms){
  return new Promise(res => {
    const id = setTimeout(()=>{ sleepers.delete(id); res(); }, ms);
    sleepers.add(id);
  });
}
function cancelWaits(){
  for(const id of sleepers) clearTimeout(id);
  sleepers.clear();
}
async function play(v){
  try{ v.currentTime = 0; await v.play(); }catch(e){ /* 자동재생 차단돼도 흐름은 계속 */ }
}
/* 공유용으로 합칠 때 경로가 data:video/mp4;base64,... 로 바뀐다.
   확장자로 판별하면 그때 전부 깨지므로 둘 다 본다. */
function isVideo(src){
  return /\.mp4(\?|$)/i.test(src) || src.startsWith('data:video');
}
/* 같은 칸에 겹쳐 둔 클립 중 하나만 보여준다.
   예전에는 src 를 갈아끼웠는데, 그러면 그 순간에 다시 받기 시작해서
   검은 화면이 잠깐 뜬다. 전부 처음부터 DOM 에 두고 표시만 바꾼다. */
function showOne(list, target){
  for(const sel of list){
    const v = $(sel);
    if(!v) continue;
    if(sel === target){ v.style.display = ''; play(v); }
    else { v.style.display = 'none'; v.pause(); }
  }
}
/* 자막 한 줄 띄우고 같이 말하게 한 뒤 지우기.
   item은 문자열이거나 {t, v, p, r} 객체. */
async function line(el, item, ms, id){
  const obj = typeof item === 'string' ? { t:item } : item;
  el.textContent = obj.t;
  el.classList.add('on');
  speak(obj);
  await wait(ms);
  if(stale(id)) return;
  el.classList.remove('on');
  await wait(360);
}

/* ── 폭죽 ── */
const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [], confettiOn = false;
const EMO = ['🍫','🎂','🎈','⭐','🎉'];
function sizeCanvas(){
  const r = stage.getBoundingClientRect();
  cv.width = r.width; cv.height = r.height;
}
function burst(n){
  for(let i=0;i<n;i++) parts.push({
    x:Math.random()*cv.width,
    y:-20-Math.random()*cv.height*0.6,
    vy:1.3+Math.random()*2.5, vx:(Math.random()-0.5)*1.3,
    rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.17,
    s:14+Math.random()*16, e:EMO[(Math.random()*EMO.length)|0]
  });
}
function tick(){
  if(!confettiOn) return;
  cx.clearRect(0,0,cv.width,cv.height);
  for(const p of parts){
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    if(p.y>cv.height+40){ p.y=-30; p.x=Math.random()*cv.width; }
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
    cx.font=p.s+'px serif'; cx.textAlign='center';
    cx.fillText(p.e,0,0); cx.restore();
  }
  requestAnimationFrame(tick);
}
addEventListener('resize', sizeCanvas);

/* ── 소리 ──
   인트로 사운드는 항상 있고, bgm.mp3는 넣어뒀을 때만 잡힌다.
   버튼 하나로 둘 다 끄고 켠다. */
const bgm = $('#bgm'), sfxIntro = $('#sfx-intro'), soundBtn = $('#sound');
let hasBgm = false, muted = false, bgmAllowed = false;
bgm.addEventListener('canplay', ()=>{ hasBgm = true; });
soundBtn.classList.add('show');
soundBtn.onclick = ()=>{
  muted = !muted;
  bgm.muted = sfxIntro.muted = muted;
  soundBtn.textContent = muted ? '🔇' : '🔊';
  if(muted) stopVoice();
  else if(bgmAllowed) startBgm();
};

/* 배경음악은 오프닝이 끝난 뒤에 깔지만, 재생 자체는 시작 버튼을 누른 그 순간에
   볼륨 0으로 걸어둔다. 브라우저(특히 iframe 안)는 사용자가 누른 순간이 아니면
   재생을 막기 때문에, 5초 뒤에 play()를 부르면 조용히 거절당한다.
   여기서는 이미 돌고 있는 소리의 볼륨만 올린다. */
let fadeTimer = null;
/* iOS 는 audio.volume 을 무시한다(읽기 전용). 그래서 volume 0 으로 깔아두면
   아이폰에서는 인트로와 배경음악이 최대 음량으로 겹쳐 나온다.
   muted 는 어디서나 통하므로 muted 로 재우고, 실제 음량은 파일 자체를
   -16dB 로 인코딩해서 맞춘다(build_site.py). */
function primeBgm(){          // 시작 버튼 클릭 안에서 호출
  bgm.muted = true;
  bgm.volume = 0;
  bgm.play().catch(()=>{});
}
function startBgm(){
  bgmAllowed = true;
  if(muted) return;
  if(bgm.paused) bgm.play().catch(()=>{});   /* 혹시 막혔었다면 다시 시도 */
  bgm.muted = false;
  clearInterval(fadeTimer);
  const step = BGM_VOLUME / 25;              /* 데스크톱에서만 실제로 먹는 페이드 */
  fadeTimer = setInterval(()=>{
    bgm.volume = Math.min(BGM_VOLUME, bgm.volume + step);
    if(bgm.volume >= BGM_VOLUME - 0.001) clearInterval(fadeTimer);
  }, 60);
}

/* ── 짱구 목소리 ──
   녹음 파일(a/vNN.mp3?b=08282334)이 있으면 그걸 쓰고, 없으면 브라우저 음성으로
   대체한다. 브라우저 음성은 그대로 쓰면 어른 목소리라, 음높이를 크게 올리고
   속도를 붙여 만화 꼬마 톤으로 만든다. */
let koVoice = null;
const voiceEl = $('#voice');
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  koVoice = vs.find(v => v.lang === 'ko-KR')
         || vs.find(v => v.lang && v.lang.startsWith('ko'))
         || null;
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.addEventListener('voiceschanged', pickVoice);
}
function stopVoice(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(!voiceEl.paused) voiceEl.pause();
}
function speak(item){
  if(!VOICE.on || muted || !item) return;
  stopVoice();
  const text = item.t || item.line || '';
  if(!item.v) return tts(text, item);
  const src = `a/${item.v}.mp3?b=08282334`;
  if(!src) return tts(text, item);
  let fellBack = false;
  const fallback = ()=>{ if(!fellBack){ fellBack = true; tts(text, item); } };
  voiceEl.onerror = fallback;
  voiceEl.src = src;
  voiceEl.play().catch(fallback);
}
function tts(text, item){
  if(!VOICE.tts || !window.speechSynthesis || !text) return;
  /* 자막의 말줄임(…, ..)은 분위기용이라 그대로 읽히면 어색하다. 공백으로 바꾼다. */
  const u = new SpeechSynthesisUtterance(text.replace(/…|\.{2,}/g, ' '));
  u.lang = VOICE.lang;
  if(koVoice) u.voice = koVoice;
  u.pitch = item && item.p != null ? item.p : VOICE.pitch;
  u.rate  = item && item.r != null ? item.r : VOICE.rate;
  speechSynthesis.speak(u);
}

/* ── 캐릭터 소개: 이미지든 영상이든 같은 자리에 ── */
const castName = $('#cast-name'), castLine = $('#cast-line');
/* 소개 컷은 넷 다 처음부터 DOM 에 있다. 표시만 바꾼다. */
const CAST_ELS = ['#c-shin', '#v-shiro', '#c-friends', '#c-mask'];
function setCast(c){
  let target = null;
  for(const sel of CAST_ELS){
    const el = $(sel);
    if(!el) continue;
    if(sel === c.el){
      el.style.display = '';
      target = el;
      if(el.tagName === 'VIDEO') play(el);
    }else{
      el.style.display = 'none';
      if(el.tagName === 'VIDEO') el.pause();
    }
  }
  return target;
}

/* ── 전체 흐름 ── */
/* 다시 보기로 들어오면 이전 재생이 남긴 상태가 그대로다.
   예를 들어 마지막에 보여준 액션가면이 표시된 채여서, 짱구보다 먼저 보인다.
   장면에 쓰이는 표시 상태를 전부 처음으로 되돌린다. */
function resetStage(){
  for(const sel of CAST_ELS){
    const el = $(sel);
    if(!el) continue;
    el.style.display = 'none';
    el.classList.remove('on');
    if(el.tagName === 'VIDEO') el.pause();
  }
  castName.textContent = '';
  castName.classList.remove('on');
  for(const id of ['cast-line','cap-run','cap-shy','cap-flirt','cap-party']){
    const el = $('#' + id);
    if(el) el.classList.remove('on');
  }
  for(const id of ['sub1','sub2','title']) $('#' + id).classList.remove('on');
  $('#letter').classList.remove('on');
  $('#dancer').classList.remove('show');
  showOne(['#v-run', '#v-news'], '#v-run');
}

async function run(){
  const my = ++runId;
  resetStage();
  $('#skip').classList.add('show');

  /* 오프닝 동안에는 배경음악을 재운다.
     첫 재생 때는 아직 시작 전이라 문제가 없지만, 다시 보기로 들어오면
     배경음악이 이미 돌고 있어서 인트로 사운드 위에 겹쳐 나온다.
     캐릭터 소개에 들어갈 때 startBgm() 이 다시 올린다. */
  bgmAllowed = false;
  clearInterval(fadeTimer);
  bgm.muted = true;
  bgm.volume = 0;

  /* 1. 오프닝 타이틀 — 인트로 영상 배경 + 인트로 사운드 */
  show('title');
  play($('#v-intro'));
  if(!muted){ sfxIntro.currentTime = 0; sfxIntro.play().catch(()=>{}); }
  $('#sub1').classList.add('on');
  await wait(700); if(stale(my)) return;
  $('#title').classList.add('on');
  speak(TITLE_LINE);            /* 2.66초, 장면(5.1초) 안에 끝난다 */
  setTimeout(()=>{
    stage.classList.add('shake');
    setTimeout(()=>stage.classList.remove('shake'),350);
  }, 390);
  await wait(1500); if(stale(my)) return;
  $('#sub2').classList.add('on');
  /* 인트로 사운드가 5초라 여기까지 5.1초를 채운다.
     3.9초에 끊으면 소리가 잘려 전환이 성급하게 느껴진다. */
  await wait(2900); if(stale(my)) return;

  /* 2. 캐릭터 소개 — 오프닝이 끝났으니 배경음악을 깔기 시작한다 */
  show('cast');
  startBgm();
  /* 타이틀이 끝나자마자 "안녕하세요"가 나오면 숨 돌릴 틈이 없다. 한 박자 쉰다. */
  await wait(500); if(stale(my)) return;
  for(const c of CAST){
    const el = setCast(c);
    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
    castName.textContent = c.name;
    castName.classList.remove('on'); void castName.offsetWidth;
    await wait(260); if(stale(my)) return;
    castName.classList.add('on');
    /* 음성이 최대 2.99초라 3.3초는 줘야 말이 안 잘린다 */
    await line(castLine, { t:c.line, v:c.v, p:c.p, r:c.r }, 3300, my);
    if(stale(my)) return;
  }

  /* 3. 러닝 — 자막에 vid 가 붙어 있으면 그 구간만 다른 클립을 보여준다 */
  show('run');
  const RUN_CLIPS = ['#v-run', '#v-news'];
  showOne(RUN_CLIPS, '#v-run');
  await wait(500); if(stale(my)) return;
  for(const t of RUN_CAPS){
    showOne(RUN_CLIPS, t.vid || '#v-run');
    await line($('#cap-run'), t, 3500, my);   /* 음성 최대 3.24초 */
    if(stale(my)) return;
  }

  /* 4. 엉덩이 임팩트 */
  show('wipe');
  play($('#v-wipe'));
  await wait(1850); if(stale(my)) return;

  /* 5. 눈썹 씰룩 */
  show('flirt');
  play($('#v-flirt'));
  await wait(400); if(stale(my)) return;
  await line($('#cap-flirt'), FLIRT_LINE, 3000, my);   /* 음성 2.38초 */
  if(stale(my)) return;

  /* 6. 쑥쓰러움 */
  show('shy');
  play($('#v-shy'));
  await wait(450); if(stale(my)) return;
  for(const t of SHY_CAPS){
    await line($('#cap-shy'), t, 2900, my);   /* 음성 최대 2.59초 */
    if(stale(my)) return;
  }

  /* 6. 피날레 */
  finale();
}

function finale(){
  $('#skip').classList.remove('show');
  /* 건너뛰기로 바로 들어올 수도 있다. 그 경우 인트로 사운드가 아직 울리고 있고
     배경음악은 오프닝 때 재워둔 상태라, 여기서 정리하고 다시 올린다. */
  sfxIntro.pause(); sfxIntro.currentTime = 0;
  startBgm();
  show('party');
  $('#dancer').classList.add('show');   /* 여기까지 숨겨 둬야 APNG 디코딩이 안 돈다 */
  /* resetStage() 가 on 을 떼므로 여기서 다시 붙여야 자막이 보인다.
     (예전엔 HTML 에 on 이 박혀 있어서 그냥 보였다) */
  const capParty = $('#cap-party');
  capParty.textContent = PARTY_LINE.t;
  capParty.classList.add('on');
  speak(PARTY_LINE);
  sizeCanvas();
  parts = []; confettiOn = true; burst(46); tick();
}

/* ── 조작 ── */
/* 폰 브라우저는 데이터를 아끼려고, 사용자가 누르기 전에는 영상을 받아두지 않는다.
   preload="auto" 도 무시한다. 그래서 장면이 바뀌는 순간에야 받기 시작해 검은 화면이 뜬다.
   시작 버튼을 누른 이 순간이 유일하게 재생이 허용되는 시점이므로,
   여기서 모든 영상을 잠깐 재생했다 멈춰 버퍼를 채워 둔다. */
function primeVideos(){
  /* 프레임을 재보니 여기서 526ms 짜리 긴 작업이 하나 생겼다. 영상 7개를
     120ms 간격으로 깨워도 디코더 준비가 겹쳐 메인 스레드를 통째로 막고,
     그동안 배경 구름이 멈춘다.
     장면에 나오는 순서대로, 넉넉한 간격으로 하나씩 깨운다.
     맨 앞 두 개만 바로 준비하면 되고 나머지는 오프닝 5초 동안 천천히 채워진다. */
  const order = ['#v-intro','#v-shiro','#v-run','#v-news','#v-wipe','#v-flirt','#v-shy'];
  const seen = new Set();
  const list = [];
  for(const sel of order){ const v = $(sel); if(v){ list.push(v); seen.add(v); } }
  for(const v of document.querySelectorAll('video')) if(!seen.has(v)) list.push(v);

  list.forEach((v, i) => setTimeout(()=>{
    const p = v.play();
    if(p && p.then) p.then(()=>{ v.pause(); v.currentTime = 0; }).catch(()=>{});
  }, i === 0 ? 0 : 250 + i * 450));
}

$('#start').onclick = ()=>{
  $('#gate').classList.add('gone');
  primeVideos();
  primeBgm();
  /* 모바일은 사용자 조작 없이는 음성이 안 나온다. 이 클릭 안에서 한 번
     빈 문장을 흘려 엔진을 깨워둬야 이후 대사가 정상 재생된다. */
  if(window.speechSynthesis){
    try{ speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); }catch(e){}
  }
  run();
};
$('#skip').onclick = ()=>{
  runId++; cancelWaits(); stopVoice();
  finale();
};
/* ── 편지/사진 넘김 ──
   직접 드래그를 구현하지 않고 scroll-snap 에 맡긴다. 폰에서 훨씬 자연스럽다.
   여기서는 지금 몇 번째 장인지 점으로만 표시한다. */
const pager = $('#pager'), pagerHint = $('#pager-hint');
pager.addEventListener('scroll', ()=>{
  const i = Math.round(pager.scrollLeft / Math.max(1, pager.clientWidth));
  pagerHint.querySelectorAll('.dot').forEach((d, n)=> d.classList.toggle('on', n === i));
  if(i > 0) pagerHint.classList.add('seen');   /* 한 번 넘기면 안내 문구는 지운다 */
}, {passive:true});

$('#open').onclick = ()=>{
  show('final');
  pager.scrollLeft = 0;
  pagerHint.classList.remove('seen');
  pagerHint.querySelectorAll('.dot').forEach((d, n)=> d.classList.toggle('on', n === 0));
  $('#letter').classList.add('on');
  /* 편지는 조용히 읽게 둔다. 음성 없음. */
  stopVoice();
  burst(40);
};
$('#replay').onclick = ()=>{
  /* 완전히 리셋한다. 소리·타이머·장면 상태를 전부 되돌리고 새로 시작. */
  runId++; cancelWaits(); stopVoice();
  sfxIntro.pause(); sfxIntro.currentTime = 0;
  clearInterval(fadeTimer);
  confettiOn = false; parts = [];
  /* 화면 상태는 run() 첫머리의 resetStage() 가 한 곳에서 되돌린다.
     여기저기 흩어 놓으니 액션가면이 남아 있는 것 같은 빠짐이 생겼다. */
  run();
};

fitStage();
sizeCanvas();
</script>
